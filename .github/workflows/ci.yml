name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Configure Git identity for repository fixtures
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "CI Harness"
          git config --global user.email "ci-harness@example.invalid"

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/ -v

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check src tests

  realism:
    name: realism (real omp binary)
    # A real-harness end-to-end gate. GitHub-hosted runners have neither the `omp`
    # binary nor agent credentials, so this runs ONLY on a self-hosted runner labelled
    # `git-shim-realism` that has `omp` installed and authenticated, and ONLY on a
    # manual dispatch -- it never blocks a PR and never lands on a hosted runner.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, git-shim-realism]
    env:
      # Install the shim's executables here so we control exactly one `git` trampoline.
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/.toolbin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the shim as a single on-PATH git
        shell: bash
        # `uv tool install` ONLY -- never `uv sync`/`uv run` here: a second (.venv) shim
        # on PATH is the two-install recursion surface the shim guards against.
        run: |
          uv tool install --force .
          echo "${{ github.workspace }}/.toolbin" >> "$GITHUB_PATH"

      - name: Confirm the shim trampoline is on PATH
        shell: bash
        run: |
          command -v git
          command -v git-shim

      - name: Run the realism gate
        shell: bash
        # `uvx pytest` runs pytest in an ephemeral env that does NOT expose this project's
        # `git` console script, so the shim installed above stays the only one on PATH.
        env:
          GIT_SHIM_REALISM: "1"
        run: uvx pytest tests/realism -m realism -v

  realism-hosted:
    name: realism (real claude binary, mock model, no auth)
    # The same real-harness proof as `realism`, but with ZERO credentials and no
    # network egress to any model, so it runs on a STOCK GitHub-hosted runner as an
    # always-on gate (no self-hosted runner, no secrets). A loopback mock LLM endpoint
    # (tests/realism/mock_llm.py) feeds the real `claude` binary one canned Bash
    # `git commit`; PATH's `git` is the shim, which stamps the bot. Validated locally
    # with `act`/`gh act` before trusting it hosted.
    runs-on: ubuntu-latest
    env:
      # Install the shim's executables here so we control exactly one `git` trampoline.
      UV_TOOL_BIN_DIR: ${{ github.workspace }}/.toolbin
      # Keep claude fully offline: suppress the fast-mode probe, telemetry, error
      # reporting and autoupdater, all of which reach the real Anthropic edge even
      # with a custom ANTHROPIC_BASE_URL. See https://code.claude.com/docs/en/network-config
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_TELEMETRY: "1"
      DISABLE_ERROR_REPORTING: "1"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Claude Code (the real harness binary)
        shell: bash
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the shim as a single on-PATH git
        shell: bash
        # `uv tool install` ONLY -- never `uv sync`/`uv run` here: a second (.venv) shim
        # on PATH is the two-install recursion surface the shim guards against.
        run: |
          uv tool install --force .
          echo "${{ github.workspace }}/.toolbin" >> "$GITHUB_PATH"

      - name: Confirm the real binary and the shim trampoline are on PATH
        shell: bash
        run: |
          command -v claude
          command -v git
          command -v git-shim
          claude --version

      - name: Run the auth-free realism gate
        shell: bash
        # `uvx pytest` runs pytest in an ephemeral env that does NOT expose this project's
        # `git` console script, so the shim installed above stays the only one on PATH.
        env:
          GIT_SHIM_REALISM_MOCK: "1"
        run: uvx pytest tests/realism -m realism_mock -v

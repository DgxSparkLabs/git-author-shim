[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-author-shim"
version = "0.1.0"
description = "Git author identity and credential shim for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "DgxSparkLabs" }
]
dependencies = []

[project.urls]
Repository = "https://github.com/DgxSparkLabs/git-author-shim"

[project.scripts]
git = "git_author_shim.__main__:main"
git-shim = "git_author_shim.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/git_author_shim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "realism: opt-in end-to-end gate that launches a real agent-harness binary; needs the binary, auth, and network (enable with GIT_SHIM_REALISM=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = []

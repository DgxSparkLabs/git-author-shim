[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uv-shims"
version = "0.1.0"
description = "Git author identity and credential shim for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "uv-shims maintainers" }
]
dependencies = []

[project.scripts]
git = "uv_shims.git.__main__:main"
git-shim = "uv_shims.git.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/uv_shims"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4"]
ignore = []
